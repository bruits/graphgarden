[workspace]
resolver = "3"
members = [
    "crates/graphgarden-protocol",
    "crates/graphgarden-core",
    "crates/graphgarden",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/bruits/graphgarden"

[workspace.lints.clippy]
missing_errors_doc = "warn"
use_self = "warn"
doc_markdown = "warn"
