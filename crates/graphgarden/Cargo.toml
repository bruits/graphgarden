[package]
name = "graphgarden"
version = "0.2.0"
description = "CLI for GraphGarden — walk a built site and generate its protocol file"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "web-programming"]

[lints]
workspace = true

[[bin]]
name = "graphgarden"
path = "src/main.rs"

[dependencies]
graphgarden-core = { path = "../graphgarden-core" , version = "0.2.0" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
