name: Deploy website

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "demo/**"
      - "crates/graphgarden-core/**"
      - "crates/graphgarden-protocol/**"
      - "packages/graphgarden-web/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "rust-toolchain.toml"
      - ".github/workflows/deploy-website.yml"
  # Builds without deploying, to reject a malformed friend origin
  pull_request:
    paths:
      - "demo/**"
      - "crates/graphgarden-core/**"
      - "crates/graphgarden-protocol/**"
      - "packages/graphgarden-web/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "rust-toolchain.toml"
      - ".github/workflows/deploy-website.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No dependency cache: a job holding deploy credentials must not restore one
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      # Also installs wrangler from the lockfile, before any secret is in reach
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter graphgarden-web --filter graphgarden-website

      - name: Build graphgarden-web
        run: pnpm --filter graphgarden-web run build

      - name: Setup Rust
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          cache: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Not --locked, as a release bumps the path crates and Cargo then rewrites only their lockfile entries
      - name: Build website
        working-directory: demo
        run: cargo run --release

      - name: Deploy
        if: github.ref == 'refs/heads/main'
        working-directory: demo
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
